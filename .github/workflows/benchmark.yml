name: Benchmarks

on:
  issue_comment:
    types: [created]
  release:
    types: [published]

jobs:
  # Gate: verify the commenter has write access before running untrusted code
  authorize:
    name: authorize
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/benchmark'))
    permissions:
      pull-requests: write
    steps:
      - name: Check commenter permission
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            const allowed = ['admin', 'write'];
            if (!allowed.includes(perm.permission)) {
              core.setFailed(`User @${context.payload.comment.user.login} does not have write access`);
              return;
            }

      - name: Add reaction to comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

  # Run benchmarks with minimal permissions (untrusted PR code)
  benchmark:
    name: benchmark
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit-sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        id: checkout
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || '' }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: Run benchmarks
        # pipefail so a benchmark failure is not masked by tee's exit code
        run: |
          set -o pipefail
          go test -run='^$' -bench=. -benchmem -count=3 -timeout=30m ./... 2>&1 | tee benchmark.txt

      # refs/pull/N/merge has the base branch tip as its first parent, so
      # the same benchmarks run against it give the baseline for the PR.
      - name: Run benchmarks (base)
        if: github.event_name == 'issue_comment'
        run: |
          set -o pipefail
          git checkout --quiet --detach HEAD^1
          go test -run='^$' -bench=. -benchmem -count=3 -timeout=30m ./... 2>&1 | tee base.txt

      - name: Compare benchmarks
        if: github.event_name == 'issue_comment'
        run: |
          set -o pipefail
          go run golang.org/x/perf/cmd/benchstat@latest base.txt benchmark.txt | tee comparison.txt

      - name: Upload benchmark results
        if: github.event_name == 'issue_comment'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results
          path: |
            benchmark.txt
            base.txt
            comparison.txt

  # Post results with write permissions (no untrusted code checkout)
  post-results:
    name: post-results
    needs: benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted comment renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .github/scripts/benchmark-comment.js
            .github/scripts/benchmark-comment.test.js
          sparse-checkout-cone-mode: false

      - name: Test benchmark comment renderer
        run: node .github/scripts/benchmark-comment.test.js

      - name: Download benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/benchmark-results

      - name: Post benchmark results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          BENCHMARK_COMMIT_SHA: ${{ needs.benchmark.outputs.commit-sha }}
          BENCHMARK_TRIGGERED_BY: ${{ github.event.comment.user.login }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { buildBenchmarkComment } = require('./.github/scripts/benchmark-comment.js');
            const results = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'benchmark-results', 'comparison.txt'), 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: buildBenchmarkComment({
                results,
                commitSha: process.env.BENCHMARK_COMMIT_SHA,
                triggeredBy: process.env.BENCHMARK_TRIGGERED_BY,
              }),
            });
